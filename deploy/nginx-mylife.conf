# MyLife phase-0 demo. Reached from outside as https://mylife.instmarket.com.au:1443
# (the router maps public 1443 to R760:443, like the other instmarket.com.au sites).
# Installed by deploy/deploy.sh from the mylife repo; touches no other site.
server {
    listen 80;
    listen [::]:80;
    server_name mylife.instmarket.com.au;
    location / {
        return 301 https://$host:1443$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mylife.instmarket.com.au;

    ssl_certificate /etc/letsencrypt/live/mylife.instmarket.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylife.instmarket.com.au/privkey.pem;

    access_log /var/log/nginx/mylife.access.log;
    error_log /var/log/nginx/mylife.error.log;

    root /opt/mylife/www;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:18960;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
