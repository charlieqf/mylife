# MyLife phase-0 demo. Reached from outside as https://mylife.instmarket.com.au:1443
# (the router maps public 1443 to R760:443, like the other instmarket.com.au sites).
# Installed by deploy/deploy.sh from the mylife repo; touches no other site.
server {
    listen 80;
    listen [::]:80;
    server_name mylife.instmarket.com.au;
    location / {
        return 301 https://$host:1443$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mylife.instmarket.com.au;

    ssl_certificate /etc/letsencrypt/live/mylife.instmarket.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mylife.instmarket.com.au/privkey.pem;

    access_log /var/log/nginx/mylife.access.log;
    error_log /var/log/nginx/mylife.error.log;

    root /opt/mylife/www;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # The page polls this to notice a new deploy (see BUILD in the page); never cached.
    location = /build.txt {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Voice input: a WAV of up to 60 s (~1.9 MB) per request.
    location = /api/asr {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:18960;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 40s;
    }

    # Pictures: the page sends a JPEG of at most 2400 px a side as a data URL (usually under 1 MB).
    location = /api/image {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:18960;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # The portrait (sign + MBTI + chart read) is one long model call, asked again when a section is missing; the page
    # waits 100 s for it.
    location = /api/portrait {
        proxy_pass http://127.0.0.1:18960;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 110s;
    }

    location /api/ {
        client_max_body_size 256k;  # 16 turns of history, his up to 2000 字 each
        proxy_pass http://127.0.0.1:18960;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
